services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chamados}
      POSTGRES_USER: ${POSTGRES_USER:-ifrn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ifrn_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ifrn} -d ${POSTGRES_DB:-chamados}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-chamados}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ifrn}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ifrn_dev}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
